<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShikshaIQ - AI Exam Preparation</title>

    <!-- Standard PWA Web Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Modern Standards-Compliant Web App Capable Tag -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS Specific Styling & Backward Compatibility -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ShikshaIQ" />
    <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1546410531-bb4caa6b424d?w=192&auto=format&fit=crop&q=80" />

    <!-- Theme Color matching ShikshaIQ Slate 900 UI -->
    <meta name="theme-color" content="#0f172a" />

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('SW registration failed:', err);
          });
        });
      }
    </script>
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
