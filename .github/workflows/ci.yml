name: ShikshaIQ Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-audit:
    name: Backend Syntax & Dependency Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci || npm install

      - name: Verify Backend JavaScript Syntax
        working-directory: ./backend
        run: |
          node --check server.js
          node --check seedQuestions.js

  frontend-build:
    name: Frontend Production Build & Bundle Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Test Production Build
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: https://shikshaiq-backend.onrender.com/api
        run: npm run build